    <circle cx="268" cy="170" r="12"/><circle cx="308" cy="170" r="12"/><circle cx="348" cy="170" r="12"/>
    <circle cx="388" cy="170" r="12"/><circle cx="428" cy="170" r="12"/>
  </g>
  <path class="dg-wall" d="M250 170 H446" />
  <!-- product falling -->
  <g class="dg-product">
    <circle cx="300" cy="82" r="3"/><circle cx="342" cy="96" r="3"/><circle cx="384" cy="80" r="3"/><circle cx="426" cy="100" r="3"/><circle cx="276" cy="118" r="3"/><circle cx="364" cy="124" r="3"/><circle cx="406" cy="132" r="3"/>
    <circle cx="330" cy="222" r="3"/><circle cx="372" cy="236" r="3"/><circle cx="350" cy="266" r="3"/><circle cx="386" cy="276" r="3"/><circle cx="338" cy="300" r="3"/><circle cx="370" cy="322" r="3"/>
  </g>
  <!-- iron caught on top of the rods -->
  <g class="dg-iron">
    <circle cx="262" cy="156" r="2.8"/><circle cx="271" cy="155" r="2.4"/><circle cx="304" cy="155" r="2.8"/><circle cx="313" cy="157" r="2.4"/>
    <circle cx="345" cy="155" r="2.6"/><circle cx="391" cy="155" r="2.8"/><circle cx="424" cy="156" r="2.4"/><circle cx="433" cy="157" r="2.8"/>
  </g>
  <!-- flow -->
  <path class="dg-flow" marker-end="url(#hg-arrow)" d="M360 16 V52"/>
  <path class="dg-flow" marker-end="url(#hg-arrow)" d="M360 330 V392"/>
  <!-- labels -->
  <text class="dg-label" x="382" y="30">Powder or granules in</text>
  <path class="dg-leader" d="M440 170 H560"/><circle class="dg-dot" cx="440" cy="170" r="2.5"/>
  <text class="dg-label" x="568" y="174">Grid of magnetic rods</text>
  <path class="dg-leader" d="M262 152 L214 120 H176"/><circle class="dg-dot" cx="262" cy="152" r="2.5"/>
  <text class="dg-label" x="170" y="124" text-anchor="end">Iron held on the rods</text>
  <text class="dg-label" x="382" y="380">Clean product out</text>
</svg>
