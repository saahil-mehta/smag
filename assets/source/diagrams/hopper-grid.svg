<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="hg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="dg-arrowhead"/></marker></defs>
  <!-- hopper -->
  <path class="dg-body" d="M200 48 H520 L412 300 V372 H308 V300 Z"/>
