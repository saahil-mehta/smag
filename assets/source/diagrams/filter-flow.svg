<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ff-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="dg-arrowhead"/></marker></defs>
  <!-- inlet and outlet pipes -->
