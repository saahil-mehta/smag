<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
  <!-- bare magnet -->
  <text class="dg-title" x="40" y="36">A bare magnet</text>
  <rect class="dg-magnet" x="140" y="96" width="60" height="70"/>
  <path class="dg-field" d="M150 96 C 110 40, 70 120, 110 170 C 130 196, 150 196, 150 166"/>
  <path class="dg-field" d="M190 96 C 230 40, 270 120, 230 170 C 210 196, 190 196, 190 166"/>
  <path class="dg-field" d="M160 96 C 140 60, 90 90, 96 140"/>
  <path class="dg-field" d="M180 96 C 200 60, 250 90, 244 140"/>
  <rect class="dg-plate" x="60" y="200" width="220" height="26"/>
  <text class="dg-label" x="40" y="262">The field spreads out on every side.</text>
  <text class="dg-label" x="40" y="282">Only part of it reaches the steel.</text>
  <!-- pot magnet -->
  <text class="dg-title" x="400" y="36">A pot magnet</text>
  <path class="dg-cup" d="M470 80 H610 V200 H590 V100 H490 V200 H470 Z"/>
  <rect class="dg-magnet" x="514" y="100" width="52" height="100"/>
  <rect class="dg-plate" x="440" y="200" width="200" height="26"/>
  <path class="dg-field" d="M530 200 C 530 218, 500 218, 500 200"/>
  <path class="dg-field" d="M550 200 C 550 218, 580 218, 580 200"/>
  <path class="dg-field" d="M522 200 C 522 222, 482 222, 482 200"/>
  <path class="dg-field" d="M558 200 C 558 222, 598 222, 598 200"/>
  <text class="dg-label" x="400" y="262">The steel cup carries the field</text>
  <text class="dg-label" x="400" y="282">to the face. It closes through the</text>
  <text class="dg-label" x="400" y="302">steel and the hold is much stronger.</text>
  <path class="dg-leader" d="M610 90 H650"/><circle class="dg-dot" cx="610" cy="90" r="2.5"/><text class="dg-label" x="656" y="94">Cup</text>
  <path class="dg-leader" d="M566 150 H650"/><circle class="dg-dot" cx="566" cy="150" r="2.5"/><text class="dg-label" x="656" y="154">Magnet</text>
</svg>
