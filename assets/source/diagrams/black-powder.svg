<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="bp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="dg-arrowhead"/></marker></defs>
  <!-- pipe -->
  <rect class="dg-plate" x="20" y="96" width="420" height="12"/>
  <rect class="dg-plate" x="20" y="172" width="420" height="12"/>
  <rect class="dg-plate" x="600" y="96" width="100" height="12"/>
  <rect class="dg-plate" x="600" y="172" width="100" height="12"/>
  <!-- corrosion on wall -->
  <g class="dg-iron">
    <circle cx="44" cy="112" r="2.4"/><circle cx="62" cy="113" r="2.8"/><circle cx="80" cy="112" r="2.2"/><circle cx="50" cy="168" r="2.6"/><circle cx="72" cy="167" r="2.2"/><circle cx="92" cy="168" r="2.8"/>
  </g>
  <!-- particles travelling -->
  <g class="dg-iron">
    <circle cx="170" cy="126" r="2.4"/><circle cx="206" cy="150" r="2.8"/><circle cx="244" cy="134" r="2.2"/><circle cx="282" cy="156" r="2.6"/><circle cx="320" cy="130" r="2.2"/><circle cx="356" cy="148" r="2.8"/><circle cx="392" cy="138" r="2.4"/><circle cx="416" cy="158" r="2.2"/>
  </g>
  <!-- inline magnetic filter -->
  <rect class="dg-body" x="440" y="64" width="160" height="152"/>
  <g class="dg-rod"><rect x="472" y="64" width="16" height="130" rx="8"/><rect x="512" y="64" width="16" height="130" rx="8"/><rect x="552" y="64" width="16" height="130" rx="8"/></g>
  <g class="dg-iron"><circle cx="470" cy="126" r="2.6"/><circle cx="469" cy="146" r="2.2"/><circle cx="510" cy="134" r="2.8"/><circle cx="509" cy="156" r="2.2"/><circle cx="550" cy="142" r="2.4"/><circle cx="571" cy="128" r="2.2"/></g>
  <!-- flow -->
  <path class="dg-flow" marker-end="url(#bp-arrow)" d="M140 140 H200"/>
  <path class="dg-flow" marker-end="url(#bp-arrow)" d="M618 140 H690"/>
  <!-- labels -->
  <path class="dg-leader" d="M62 112 V60"/><circle class="dg-dot" cx="62" cy="112" r="2.5"/>
  <text class="dg-label" x="20" y="50">Rust and iron sulphide form on the wall</text>
  <text class="dg-label" x="160" y="222">Particles break off and travel with the flow</text>
  <path class="dg-leader" d="M520 216 V258"/><circle class="dg-dot" cx="520" cy="216" r="2.5"/>
  <text class="dg-label" x="420" y="276">Magnetic filter holds the black powder</text>
  <text class="dg-label" x="604" y="76">Clean flow</text>
</svg>
