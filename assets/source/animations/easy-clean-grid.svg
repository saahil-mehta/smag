<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ec-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="dg-arrowhead"/></marker>
    <clipPath id="ec-chute"><rect x="172" y="0" width="256" height="400"/></clipPath>
  </defs>
  <!-- product falling through the chute -->
  <g class="an an-ec-product" clip-path="url(#ec-chute)">
    <g class="an an-stream dg-product">
      <circle cx="194" cy="-40" r="3"/><circle cx="194" cy="20" r="3"/><circle cx="194" cy="80" r="3"/><circle cx="194" cy="140" r="3"/><circle cx="194" cy="200" r="3"/><circle cx="194" cy="260" r="3"/><circle cx="194" cy="320" r="3"/><circle cx="194" cy="380" r="3"/>
      <circle cx="232" cy="-20" r="3"/><circle cx="232" cy="40" r="3"/><circle cx="232" cy="100" r="3"/><circle cx="232" cy="160" r="3"/><circle cx="232" cy="220" r="3"/><circle cx="232" cy="280" r="3"/><circle cx="232" cy="340" r="3"/><circle cx="232" cy="400" r="3"/>
      <circle cx="270" cy="-50" r="3"/><circle cx="270" cy="10" r="3"/><circle cx="270" cy="70" r="3"/><circle cx="270" cy="130" r="3"/><circle cx="270" cy="190" r="3"/><circle cx="270" cy="250" r="3"/><circle cx="270" cy="310" r="3"/><circle cx="270" cy="370" r="3"/>
      <circle cx="308" cy="-30" r="3"/><circle cx="308" cy="30" r="3"/><circle cx="308" cy="90" r="3"/><circle cx="308" cy="150" r="3"/><circle cx="308" cy="210" r="3"/><circle cx="308" cy="270" r="3"/><circle cx="308" cy="330" r="3"/><circle cx="308" cy="390" r="3"/>
      <circle cx="346" cy="-10" r="3"/><circle cx="346" cy="50" r="3"/><circle cx="346" cy="110" r="3"/><circle cx="346" cy="170" r="3"/><circle cx="346" cy="230" r="3"/><circle cx="346" cy="290" r="3"/><circle cx="346" cy="350" r="3"/><circle cx="346" cy="410" r="3"/>
      <circle cx="384" cy="-45" r="3"/><circle cx="384" cy="15" r="3"/><circle cx="384" cy="75" r="3"/><circle cx="384" cy="135" r="3"/><circle cx="384" cy="195" r="3"/><circle cx="384" cy="255" r="3"/><circle cx="384" cy="315" r="3"/><circle cx="384" cy="375" r="3"/>
      <circle cx="414" cy="-25" r="3"/><circle cx="414" cy="35" r="3"/><circle cx="414" cy="95" r="3"/><circle cx="414" cy="155" r="3"/><circle cx="414" cy="215" r="3"/><circle cx="414" cy="275" r="3"/><circle cx="414" cy="335" r="3"/><circle cx="414" cy="395" r="3"/>
    </g>
  </g>
  <!-- chute walls and the plate the tubes pass through -->
  <path class="dg-wall" d="M170 16 V384 M430 16 V384"/>
  <!-- stainless tubes -->
  <g class="dg-rod">
    <rect x="172" y="128" width="266" height="24" rx="12"/>
    <rect x="172" y="183" width="266" height="24" rx="12"/>
    <rect x="172" y="238" width="266" height="24" rx="12"/>
  </g>
  <rect class="dg-steel" x="430" y="104" width="14" height="182"/>
  <!-- iron held on the tubes, in three waves -->
  <g class="an an-ec-drop dg-iron">
    <g class="an an-ec-w1">
      <circle cx="206" cy="124" r="2.8"/><circle cx="290" cy="125" r="2.4"/><circle cx="372" cy="124" r="2.8"/>
      <circle cx="240" cy="179" r="2.6"/><circle cx="330" cy="180" r="2.8"/><circle cx="262" cy="234" r="2.6"/><circle cx="398" cy="235" r="2.4"/>
    </g>
    <g class="an an-ec-w2">
      <circle cx="226" cy="125" r="2.4"/><circle cx="332" cy="124" r="2.8"/><circle cx="410" cy="125" r="2.4"/>
      <circle cx="198" cy="180" r="2.4"/><circle cx="286" cy="179" r="2.6"/><circle cx="376" cy="180" r="2.4"/><circle cx="220" cy="234" r="2.8"/><circle cx="340" cy="235" r="2.6"/>
    </g>
    <g class="an an-ec-w3">
      <circle cx="256" cy="124" r="2.6"/><circle cx="352" cy="125" r="2.4"/><circle cx="264" cy="156" r="2.4"/>
      <circle cx="404" cy="179" r="2.8"/><circle cx="306" cy="234" r="2.4"/><circle cx="378" cy="234" r="2.8"/><circle cx="244" cy="266" r="2.4"/>
    </g>
  </g>
  <!-- magnet cores on their frame, drawn out along the tubes to clean -->
  <g class="an an-ec-cores">
    <g class="dg-magnet">
      <rect x="184" y="134" width="262" height="12" rx="6"/>
      <rect x="184" y="189" width="262" height="12" rx="6"/>
      <rect x="184" y="244" width="262" height="12" rx="6"/>
    </g>
    <rect class="dg-steel" x="446" y="112" width="12" height="166"/>
    <path class="dg-hook" d="M458 172 H484 Q492 172 492 180 V210 Q492 218 484 218 H458"/>
  </g>
  <!-- flow -->
  <path class="dg-flow" marker-end="url(#ec-arrow)" d="M300 2 V24"/>
  <path class="dg-flow" marker-end="url(#ec-arrow)" d="M300 358 V396"/>
  <!-- labels -->
  <path class="dg-leader" d="M156 116 L178 140"/><circle class="dg-dot" cx="178" cy="140" r="2.5"/>
  <text class="dg-label" x="150" y="114" text-anchor="end">Stainless tube</text>
  <path class="dg-leader" d="M156 178 L196 178"/><circle class="dg-dot" cx="196" cy="178" r="2.5"/>
  <text class="dg-label" x="150" y="166" text-anchor="end">Iron held</text>
  <text class="dg-label" x="150" y="190" text-anchor="end">on the tube</text>
  <text class="dg-label" x="164" y="20" text-anchor="end">Product in</text>
  <text class="dg-label" x="164" y="384" text-anchor="end">Clean product out</text>
</svg>
